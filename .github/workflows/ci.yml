# Checks every push and pull request; a version tag (v1.2.3) also attaches the extension zip to its GitHub release.
# There is nothing to build: the zip is the source files the extension loads (see scripts/pack.sh).
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax of every module
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Tests (package, translations, logic)
        run: npm test

      - name: Package
        run: sh scripts/pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tabula-extension
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Tag matches the manifest version
        run: |
          version="v$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json ($version)"; exit 1
          fi

      - name: Package
        run: sh scripts/pack.sh

      # A release written by hand on GitHub (for this tag) just gets the zip; otherwise one is created.
      - name: GitHub release with the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Tabula $GITHUB_REF_NAME" --generate-notes
          fi
